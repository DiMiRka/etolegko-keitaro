name: etolegko-keitaro

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?задайте DOMAIN в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.30.57.2
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://keitaro:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@db:5432/keitaro
      COOKIE_SECURE: "true"
      FORWARDED_ALLOW_IPS: 172.30.57.2
    networks:
      - edge
      - backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keitaro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: keitaro
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keitaro -d keitaro"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: keitaro
      PGDATABASE: keitaro
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ./backups:/backups
    networks:
      - edge
      - backend
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/keitaro-$$(date -u +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file"
            echo "backup ok: $$file"
            find /backups -name 'keitaro-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
            [ -n "$$BACKUP_PING_URL" ] && wget -qO- "$$BACKUP_PING_URL" > /dev/null
          else
            rm -f "$$file.tmp"
            echo "backup failed"
            [ -n "$$BACKUP_PING_URL" ] && wget -qO- "$$BACKUP_PING_URL/fail" > /dev/null
          fi
          sleep $$(( BACKUP_INTERVAL_HOURS * 3600 ))
        done
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.57.0/24
  backend:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
