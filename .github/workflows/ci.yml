name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: python -m unittest discover -s tests -v

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keitaro
          POSTGRES_PASSWORD: keitaro
          POSTGRES_DB: keitaro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keitaro"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://keitaro:keitaro@localhost:5432/keitaro
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Upgrade, downgrade and upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t keitaro-wrapper .

  prod-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: localhost
      COMPOSE: docker compose -f docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v4

      - name: Prepare .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "ADMIN_USERNAME=ci"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 12)"
            echo "KEITARO_API_KEY=dummy"
          } > .env

      - name: Validate compose
        run: $COMPOSE config --quiet

      - name: Start
        run: $COMPOSE up -d --build --wait --wait-timeout 180

      - name: Check HTTPS, redirects and proxy headers
        run: |
          curl -kfsS https://localhost/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/health)" = "308"
          test "$(curl -ks -o /dev/null -w '%{http_code}' https://localhost/api/campaigns)" = "401"
          curl -ks https://localhost/login | grep -q 'href="https://localhost/static/app.css'
          curl -ksI https://localhost/login | grep -qi '^strict-transport-security'

      - name: Check that only Caddy publishes ports
        run: |
          for s in caddy app db backup; do
            ports=$(docker inspect --format '{{json .NetworkSettings.Ports}}' "$($COMPOSE ps -q $s)")
            echo "$s: $ports"
            if [ "$s" = caddy ]; then
              echo "$ports" | grep -q HostPort
            else
              ! echo "$ports" | grep -q HostPort
            fi
          done

      - name: Check backup
        run: |
          sleep 5
          ls -l backups
          ls backups/keitaro-*.dump

      - name: Logs on failure
        if: failure()
        run: |
          $COMPOSE ps -a
          for c in $($COMPOSE ps -aq); do
            echo "== $(docker inspect --format '{{.Name}}' "$c")"
            docker inspect --format '{{json .State.Health}}' "$c"
          done
          $COMPOSE logs --no-color

      - name: Stop
        if: always()
        run: $COMPOSE down -v
