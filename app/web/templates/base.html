<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Keitaro wrapper{% endblock %}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/css/select2.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}?v={{ asset_version }}">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <a href="/" class="brand">Keitaro wrapper</a>
      <nav class="menu">
        <a href="/campaigns" class="menu-item{% if nav == 'campaigns' %} active{% endif %}">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 11l18-8-8 18-2-8z"/></svg>
          <span>Кампании</span>
        </a>
        <a href="/offers" class="menu-item{% if nav == 'offers' %} active{% endif %}">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg>
          <span>Офферы</span>
        </a>
      </nav>
      {% if request.state.user %}
      <form method="post" action="/logout" class="user-box">
        <span class="user-name" title="Вы вошли как {{ request.state.user.username }}">{{ request.state.user.username }}</span>
        <button type="submit" class="logout">Выйти</button>
      </form>
      {% endif %}
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.1.0-rc.0/js/select2.min.js"></script>
  <script src="{{ url_for('static', path='app.js') }}?v={{ asset_version }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
